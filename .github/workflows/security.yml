name: Security as Code

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

# Permisos mínimos: solo lectura del contenido y de los datos del PR que
# necesita Gitleaks para comparar los commits de la rama.
permissions:
  contents: read
  pull-requests: read

# Cancela ejecuciones anteriores de la misma rama/PR para no gastar minutos.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Detectar secretos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checkov:
    name: Analizar Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          config_file: .checkov.yaml

  trivy:
    name: Analizar imagen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t security-as-code-lab:${{ github.sha }} .
      - name: Escanear imagen
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: security-as-code-lab:${{ github.sha }}
          format: table
          # Se evalúan las dependencias de la aplicación (Python). Las
          # vulnerabilidades del sistema operativo de la imagen base se
          # gestionan actualizando la imagen base y se documentan aparte.
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
